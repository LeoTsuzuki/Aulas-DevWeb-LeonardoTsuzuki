name: Deploy GitHub Pages da subpasta

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Define qual subpasta será publicada como a raiz do site
          path: './attPaginasHtmlApresentacao'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
