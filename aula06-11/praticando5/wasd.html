<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASD movimentação de div</title>
    <script src="wasd.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="p-4">

    <div class="container">
        <h1 class="mb-3">Praticando 5 - Mini-game JS</h1>

        <p class="mb-1"><strong><u>Instruções:</u></strong></p>
        <ol>
            <li>Clique em um dos quadrados coloridos</li>
            <li>Depois use as teclas <strong> <mark>W</mark> <mark>A</mark> <mark>S</mark> <mark>D</mark></strong> 
                para movimentar os elementos para cima, esquerda, baixo e direita respectivamente.</li>
        </ol>

        <div class="text-center my-4">
         
            <img src="wasd.jpg" style="max-width: 280px;">
        </div>

        <div class="mt-4">
            <div class="quadrado vermelho"></div>
            <div class="quadrado azul"></div>
            <div class="quadrado verde"></div>
        </div>
    </div>
