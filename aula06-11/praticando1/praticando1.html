<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 1</title>
    <script src="arquivojs1.js"></script>
    <style>
         button {
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 15px;
            cursor: pointer;
            font-size: 15px;
        }
        #caixa{
            width:90vw;
            margin: 20px;
            height: 200px;
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        p{
            font-size: 30px;
        }
        #container{
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <h1>Praticando 1 - Mostrar/Esconder</h1>
    <div id="container">
        <button id="btnMostrar" onclick="mostrar()">Mostrar</button>
        <button id="btnEsconder" onclick="esconder()">Esconder</button>
    </div>
    <div id="caixa">
        <p>Meu Div</p>
    </div>
</body>
</html>
